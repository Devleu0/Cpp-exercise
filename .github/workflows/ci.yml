name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  algorithms:
    name: 03_algorithms (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Build & test
        env:
          CXX: ${{ matrix.cxx }}
        run: bash scripts/run_tests.sh
